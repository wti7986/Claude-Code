<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Jev Typo Checker</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 260px;
        padding: 12px;
        font-size: 13px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-weight: 600;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        margin-bottom: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      button {
        width: 100%;
        padding: 6px;
        cursor: pointer;
      }
      #status {
        margin-top: 8px;
        color: #4a7c34;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <label for="enabled" style="margin-bottom: 0">有効にする</label>
      <input type="checkbox" id="enabled" />
    </div>
    <label for="backendUrl">バックエンドURL</label>
    <input type="text" id="backendUrl" placeholder="http://localhost:3300" />
    <label for="authToken">認証トークン</label>
    <input type="text" id="authToken" placeholder="APP_SHARED_TOKEN の値" />
    <button id="save">保存</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
